<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Profile Card</title>
    <link rel="stylesheet" href="card.css">
</head>

<body>

    <h1>User Profile Card</h1>

    <div class="card">
        <table class="profile-table">
            <tr>
                <td class="img-cell">
                    <img src="https://images.unsplash.com/photo-1543466835-00a7907e9de1?q=80&w=400"
                        alt="Profile Picture" class="profile-img">
                </td>
            </tr>
            <tr>
                <td class="login">kchaitho</td>
            </tr>
            <tr>
                <td class="description">Moodeng</td>
            </tr>
            <tr>
                <td class="socials">
                    <img src="https://cdn-icons-png.flaticon.com/512/1384/1384063.png" alt="instagram"
                        class="social-icon">
                    <img src="https://cdn-icons-png.flaticon.com/512/733/733547.png" alt="facebook" class="social-icon">
                    <img src="https://thumb.wikimedia.org/wikipedia/commons/thumb/4/41/LINE_logo.svg/1280px-LINE_logo.svg.png?utm_source=th.wikipedia.org&utm_campaign=index&utm_content=thumbnail"
                        alt="line" class="social-icon">
                </td>
            </tr>
            <tr>
                <td>
                    <button class="contact-btn">Contact</button>
                </td>
            </tr>
        </table>
    </div>

</body>

</html>
