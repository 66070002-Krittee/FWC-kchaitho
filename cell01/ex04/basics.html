<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Basics</title>
    <style>
        body {
            background-color: pink;
        }

        h1 {
            color: white;
            text-align: center;
        }

        .shop-container {
            display: flex;
            justify-content: center;
            gap: 40px;
        }

        .shop-item {
            text-align: center;
        }

        .shop-item img {
            width: 200px;
            height: 200px;
            object-fit: contain;
        }

        footer {
            text-align: right;
            font-style: italic;
            font-family: monospace;
        }
    </style>
</head>

<body>

    <h1>Welcome to Online Shop!</h1>

    <div class="shop-container">
        <div class="shop-item">
            <img src="https://upload.wikimedia.org/wikipedia/commons/a/a9/Amazon_logo.svg" alt="Amazon">
            <br>
            <a href="https://www.amazon.com" target="_blank">Amazon</a>
        </div>
        <div class="shop-item">
            <img src="https://upload.wikimedia.org/wikipedia/commons/f/fe/Shopee.svg" alt="Shopee">
            <br>
            <a href="https://shopee.co.th" target="_blank">Shopee</a>
        </div>
    </div>

    <hr>

    <footer>
        &copy; kchaitho 2026
    </footer>

</body>

</html>
