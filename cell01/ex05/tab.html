<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Tab</title>
    <style>
        table {
            width: 100%;
            border-collapse: collapse;
            table-layout: fixed;
        }

        td {
            width: 50%;
            padding: 50px 20px;
            border: 1px solid black;
            font-family: sans-serif;
            font-size: 18px;
            vertical-align: middle;
        }

        .first-box {
            background-color: #545a27;
        }

        .second-box {
            background-color: #bd480e;
        }
    </style>
</head>

<body>

    <table>
        <tr>
            <td class="first-box">First</td>
            <td class="second-box">Second</td>
        </tr>
    </table>

</body>

</html>
