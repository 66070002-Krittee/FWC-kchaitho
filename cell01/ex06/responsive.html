<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive</title>
    <style>
        html,
        body {
            height: 100%;
            margin: 0;
            padding: 0;
        }

        table {
            width: 100%;
            height: 100%;
            border-collapse: collapse;
            table-layout: fixed;
        }

        td {
            width: 50%;
            padding: 20px;
            border: 1px solid black;
            font-family: sans-serif;
            font-size: 18px;
            text-align: center;
            vertical-align: middle;
            box-sizing: border-box;
        }

        .first-box {
            background-color: #545a27;
        }

        .second-box {
            background-color: #bd480e;
        }

        /* เมื่อหน้าจอแคบลง (เช่น บนมือถือ) ให้สลับมาวางซ้อนกันคนละ 50% ความสูง */
        @media (max-width: 768px) {
            td {
                display: block;
                width: 100%;
                height: 50%;
            }
        }
    </style>
</head>

<body>

    <table>
        <tr>
            <td class="first-box">First</td>
            <td class="second-box">Second</td>
        </tr>
    </table>

</body>

</html>
