<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Resumes</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', Helvetica, Arial, sans-serif;
        }

        .reveal {
            opacity: 0;
            transform: translateY(24px);
            transition: opacity .7s ease, transform .7s ease;
        }

        .reveal.in {
            opacity: 1;
            transform: none;
        }

        .grain::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 1;
            background-image: radial-gradient(#00000008 1px, transparent 1px);
            background-size: 4px 4px;
        }
    </style>
</head>

<body class="bg-neutral-50 text-neutral-900 grain">

    <main class="relative z-10 min-h-screen flex flex-col">

        <header class="px-6 sm:px-10 py-8 flex items-center justify-between text-sm">
            <p class="tracking-widest uppercase text-neutral-400">42Bangkok</p>
            <p class="tracking-widest uppercase text-neutral-400">Discovery Piscine</p>
        </header>

        <div class="flex-1 flex flex-col justify-center max-w-5xl mx-auto w-full px-6 sm:px-10 py-16">

            <p class="reveal text-sm tracking-widest uppercase text-neutral-400">Rush &mdash; 2026</p>

            <h1 class="reveal mt-6 text-5xl sm:text-7xl lg:text-8xl font-extralight leading-[0.95] tracking-tight">
                Welcome to<br>
                <span class="text-neutral-400">Our Rush Project</span>
            </h1>

            <p class="reveal mt-8 max-w-md text-neutral-500 leading-relaxed">
                Select whose portfolio you want to view:
            </p>

            <div class="reveal mt-16 grid gap-px bg-neutral-200 sm:grid-cols-2 border border-neutral-200">

                <a href="sukupkar.html"
                    class="group bg-neutral-50 hover:bg-white p-8 sm:p-10 transition-colors duration-300">
                    <div class="flex items-start justify-between">
                        <p class="text-xs tracking-widest uppercase text-neutral-400">01</p>
                        <span
                            class="text-neutral-300 group-hover:text-neutral-900 group-hover:translate-x-1 transition-all duration-300">&rarr;</span>
                    </div>
                    <p class="mt-10 text-3xl font-light tracking-tight">Sukrit<br>Kupkarn</p>
                    <p class="mt-4 text-sm text-neutral-400 font-mono">sukupkar</p>
                    <p class="mt-6 text-sm text-neutral-500">Computer Vision &amp; AI Engineer</p>
                </a>

                <a href="kchaitho.html"
                    class="group bg-neutral-50 hover:bg-white p-8 sm:p-10 transition-colors duration-300">
                    <div class="flex items-start justify-between">
                        <p class="text-xs tracking-widest uppercase text-neutral-400">02</p>
                        <span
                            class="text-neutral-300 group-hover:text-neutral-900 group-hover:translate-x-1 transition-all duration-300">&rarr;</span>
                    </div>
                    <p class="mt-10 text-3xl font-light tracking-tight">Krittee<br>Chaithongkum</p>
                    <p class="mt-4 text-sm text-neutral-400 font-mono">kchaitho</p>
                    <p class="mt-6 text-sm text-neutral-500">Data Engineer / Data Analyst</p>
                </a>

            </div>

        </div>

        <footer
            class="px-6 sm:px-10 py-8 border-t border-neutral-200 flex flex-col sm:flex-row gap-2 sm:items-center sm:justify-between text-sm text-neutral-400">
            <p>&copy; sukupkar &middot; kchaitho &mdash; 2026</p>
            <p class="font-mono">Bangkok, Thailand</p>
        </footer>

    </main>

    <script>
        var items = document.querySelectorAll(".reveal");
        var observer = new IntersectionObserver(function (entries) {
            entries.forEach(function (entry) {
                if (entry.isIntersecting) {
                    entry.target.classList.add("in");
                }
            });
        }, { threshold: 0.15 });

        items.forEach(function (item, i) {
            item.style.transitionDelay = (i * 90) + "ms";
            observer.observe(item);
        });
    </script>

</body>

</html>
